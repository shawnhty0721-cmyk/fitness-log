<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练日志</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

<div class="container">

<header class="top">
  <h1>训练日志</h1>
  <div class="subtitle">Keep × iOS 极简版</div>
</header>

<nav class="tabs">
  <button class="active" onclick="switchTab('today',this)">今日训练</button>
  <button onclick="switchTab('history',this)">历史记录</button>
  <button onclick="switchTab('analysis',this)">分析报告</button>
  <button onclick="switchTab('max',this)">极限重量</button>
</nav>

<!-- 今日训练 -->
<section id="today" class="tab">
  <div class="card">
    <h2>今日训练</h2>

    <label class="label">训练部位</label>
    <select id="muscle" class="control" onchange="updateExerciseOptions()">
      <option>胸</option>
      <option>背</option>
      <option>腿</option>
      <option>肩</option>
      <option>手臂</option>
      <option>核心</option>
      <option>其他</option>
      <option value="__custom__">自定义</option>
    </select>
    <input id="muscleInput" class="control hidden" placeholder="输入训练部位或内容" oninput="updateExerciseOptions()">

    <label class="label">动作名称</label>
    <select id="exerciseSelect" class="control"></select>
    <input id="exerciseInput" class="control hidden" placeholder="输入新动作">

    <label class="label">重量 (kg)</label>
    <input id="weight" class="control" type="number" inputmode="decimal">

    <label class="label">次数</label>
    <input id="reps" class="control" type="number" inputmode="numeric">

    <label class="label">组数</label>
    <input id="sets" class="control" type="number" inputmode="numeric">

    <button class="primary" onclick="addRecord()">保存记录</button>
  </div>

  <div class="card">
    <h2>今日预览</h2>
    <div id="todayList"></div>
  </div>
</section>

<!-- 历史 -->
<section id="history" class="tab hidden">
  <div class="card">
    <h2>历史记录</h2>

    <div class="history-bar">
      <input id="historyDate" class="control" type="date" onchange="onHistoryDateChange()" />
      <button class="ghost" onclick="jumpToLatestHistoryDate()">最近一次</button>
      <button class="danger-soft" onclick="deleteSelectedDay()">删除当天</button>
    </div>
    <div id="historyDateList"></div>

    <div id="historyList"></div>
  </div>
</section>

<!-- 分析 -->
<section id="analysis" class="tab hidden">

  <div class="card">
    <div class="card-title-row">
      <h2>分析报告</h2>
      <div class="segmented">
        <button id="range7Btn" class="active" onclick="setAnalysisRange(7)">近7天</button>
        <button id="range30Btn" onclick="setAnalysisRange(30)">近30天</button>
      </div>
    </div>

    <p class="metric">训练天数：<b id="analysisDays">0</b></p>
    <canvas id="analysisBar"></canvas>
    <div id="analysisTable"></div>
  </div>

  <div class="card">
    <h2>动作 PR</h2>
    <div id="analysisPrList"></div>
  </div>

  <div class="card">
    <h2>重量趋势（最近5次）</h2>
    <select id="trendSelect" class="control" onchange="renderTrend()"></select>
    <canvas id="trendChart"></canvas>
  </div>

</section>

<!-- 极限 -->
<section id="max" class="tab hidden">
  <div class="card">
    <h2>极限重量</h2>
    <div id="maxList"></div>
  </div>

  <div class="card">
    <h2>数据管理</h2>
    <div class="data-actions">
      <button class="ghost" onclick="exportJSON()">导出 JSON</button>
      <label class="ghost file-button">
        导入 JSON
        <input id="importFile" type="file" accept="application/json,.json" onchange="importJSON(event)">
      </label>
    </div>
    <p class="hint">导出的数据兼容未来 AI 分析，也会继续兼容旧版单条记录格式。</p>
  </div>
</section>

</div>

<script src="app.js"></script>
</body>
</html>
